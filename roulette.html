<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #050914 70%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(to right, #fff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(56, 189, 248, 0.3));
        }
        .wheel-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            margin-bottom: 30px;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
            transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: rotate(0deg);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }
        .spin-btn {
            padding: 16px 50px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Unbounded', sans-serif;
        }
        .spin-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 15px 35px rgba(16, 185, 129, 0.6); }
        .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: scale(0.95); }
        .result {
            margin-top: 25px;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: translateY(15px);
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .result.show { opacity: 1; transform: translateY(0); }
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; opacity: 0; }
    </style>
</head>
<body>

    <h1>Крути и выигрывай!</h1>
    
    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="340" height="340"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn">Крутить</button>
    <div class="result" id="result"></div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('spinBtn');
        const resultEl = document.getElementById('result');

        const prizes = [
            { label: "Миксер", color: "#6366f1" },
            { label: "Вертикальный пылесос", color: "#0ea5e9" },
            { label: "Bluetooth колонка", color: "#10b981" },
            { label: "Набор инструментов", color: "#f59e0b" }
        ];

        const numSegments = prizes.length;
        const arcSize = (2 * Math.PI) / numSegments;
        let currentAngle = 0;
        let isSpinning = false;

        // Функция отрисовки колеса
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 10;

            for (let i = 0; i < numSegments; i++) {
                // Рисуем сектор
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * arcSize, (i + 1) * arcSize);
                ctx.fill();

                // Разделительная линия
                ctx.strokeStyle = "rgba(255,255,255,0.2)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Рисуем текст
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(i * arcSize + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px Inter, sans-serif";
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                // Разбиваем длинный текст на две строки
                let text = prizes[i].label;
                if (text.length > 12) {
                    let words = text.split(' ');
                    if (words.length > 1) {
                        let mid = Math.ceil(words.length / 2);
                        let line1 = words.slice(0, mid).join(' ');
                        let line2 = words.slice(mid).join(' ');
                        ctx.fillText(line1, radius - 15, -5);
                        ctx.fillText(line2, radius - 15, 10);
                    } else {
                        ctx.fillText(text, radius - 15, 0);
                    }
                } else {
                    ctx.fillText(text, radius - 15, 0);
                }
                ctx.restore();
            }

            // Внутренний ободок
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        // Первичная отрисовка
        drawWheel();

        // Логика вращения
        btn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            btn.disabled = true;
            resultEl.classList.remove('show');

            // Выбираем случайный приз
            const winningIndex = Math.floor(Math.random() * numSegments);

            // Рассчитываем угол для остановки
            // Указатель находится сверху (12 часов). 
            // Нам нужно повернуть колесо так, чтобы центр выигрышного сектора оказался под указателем.
            // Угол центра сектора: (winningIndex * 90) + 45.
            // Так как указатель сверху, нам нужно сместить на -90 градусов.
            const targetAngle = 360 - ((winningIndex * 90) + 45);
            
            // Добавляем 5 полных оборотов (1800 градусов) для эффекта
            currentAngle += 1800 + targetAngle;
            
            canvas.style.transform = `rotate(${currentAngle}deg)`;

            // Показываем результат через 4 секунды (длительность анимации)
            setTimeout(() => {
                isSpinning = false;
                btn.disabled = false;
                resultEl.textContent = `Ваш приз: ${prizes[winningIndex].label}! 🎉`;
                resultEl.classList.add('show');
            }, 4000);
        });
    </script>
</body>
</html>
