<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #050914 70%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(to right, #fff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(56, 189, 248, 0.3));
        }
        .wheel-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.2));
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            transform: rotate(0deg);
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 45px;
            background: #ef4444;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            border-radius: 4px;
        }
        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 4px solid #38bdf8;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5), inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .spin-btn {
            padding: 16px 50px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Unbounded', sans-serif;
            position: relative;
            z-index: 20;
        }
        .spin-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 15px 35px rgba(16, 185, 129, 0.6); }
        .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: scale(0.95); }
        
        .result-container {
            min-height: 80px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
        }
        .result {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: translateY(15px) scale(0.9);
            color: #fff;
            background: rgba(16, 185, 129, 0.1);
            padding: 12px 25px;
            border-radius: 16px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .result.show { opacity: 1; transform: translateY(0) scale(1); }
        
        .prize-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .prize-subtitle {
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1>Крути и выигрывай!</h1>
    
    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas"></canvas>
        <div class="center-cap">🎁</div>
    </div>

    <button class="spin-btn" id="spinBtn">Крутить</button>
    
    <div class="result-container">
        <div class="result" id="result"></div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('spinBtn');
        const resultEl = document.getElementById('result');

        const prizes = [
            { label: "Миксер", color: "#6366f1" },
            { label: "Вертикальный пылесос", color: "#10b981" },
            { label: "Bluetooth колонка", color: "#f59e0b" },
            { label: "Набор инструментов", color: "#8b5cf6" }
        ];

        const numSegments = prizes.length;
        const arcSize = (2 * Math.PI) / numSegments;
        let currentAngle = 0;
        let isSpinning = false;

        // Настройка Retina-дисплея
        const size = 340;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        ctx.scale(dpr, dpr);

        function drawWheel() {
            ctx.clearRect(0, 0, size, size);
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = centerX - 5;

            for (let i = 0; i < numSegments; i++) {
                // Сектор
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, i * arcSize + 0.01, (i + 1) * arcSize - 0.01);
                ctx.fill();

                // Текст
                ctx.save();
                ctx.translate(centerX, centerY);
                let angle = i * arcSize + arcSize / 2;
                ctx.rotate(angle);
                
                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px 'Inter', sans-serif";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                let textRadius = radius - 20;
                let label = prizes[i].label;

                // Переворот текста для левой половины
                if (angle > Math.PI / 2 && angle < (3 * Math.PI) / 2) {
                    ctx.rotate(Math.PI);
                    ctx.textAlign = "left";
                    
                    if (label.length > 12) {
                        let words = label.split(' ');
                        let mid = Math.ceil(words.length / 2);
                        ctx.fillText(words.slice(0, mid).join(' '), -textRadius, -8);
                        ctx.fillText(words.slice(mid).join(' '), -textRadius, 8);
                    } else {
                        ctx.fillText(label, -textRadius, 0);
                    }
                } else {
                    if (label.length > 12) {
                        let words = label.split(' ');
                        let mid = Math.ceil(words.length / 2);
                        ctx.fillText(words.slice(0, mid).join(' '), textRadius, -8);
                        ctx.fillText(words.slice(mid).join(' '), textRadius, 8);
                    } else {
                        ctx.fillText(label, textRadius, 0);
                    }
                }
                
                ctx.restore();
            }

            // Внутренний ободок
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 6;
            ctx.stroke();
        }

        drawWheel();

        btn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            btn.disabled = true;
            resultEl.classList.remove('show');
            
            // Очищаем старый результат
            setTimeout(() => { resultEl.innerHTML = ''; }, 300);

            const winningIndex = Math.floor(Math.random() * numSegments);

            // Математика остановки
            let targetAngle = (270 - ((winningIndex * 90) + 45)) % 360;
            if (targetAngle < 0) targetAngle += 360;

            let currentMod = currentAngle % 360;
            let rotationNeeded = (targetAngle - currentMod + 360) % 360;

            currentAngle += 1800 + rotationNeeded;
            
            canvas.style.transform = `rotate(${currentAngle}deg)`;

            // Показ результата
            setTimeout(() => {
                isSpinning = false;
                btn.disabled = false;
                
                // Вставляем две строки: заголовок и подпись
                resultEl.innerHTML = `
                    <div class="prize-title">Ваш приз: ${prizes[winningIndex].label}! 🎉</div>
                    <div class="prize-subtitle">Озвучьте ваш приз при заказе своему менеджеру</div>
                `;
                resultEl.classList.add('show');
            }, 5000);
        });
    </script>
</body>
</html>
