<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Фортуны</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: #050914;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #050914 70%);
        }
        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(to right, #fff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 30px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #1e293b;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
            /* 4 сектора по 90 градусов */
            background: conic-gradient(
                #6366f1 0deg 90deg, 
                #0ea5e9 90deg 180deg, 
                #10b981 180deg 270deg, 
                #f59e0b 270deg 360deg
            );
            position: relative;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.15, 1);
        }
        /* Текст внутри колеса */
        .wheel-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transform-origin: 0 0;
            white-space: nowrap;
        }
        /* Позиционирование текста */
        .txt-1 { transform: rotate(45deg) translate(90px, -10px); }
        .txt-2 { transform: rotate(135deg) translate(90px, -10px); }
        .txt-3 { transform: rotate(225deg) translate(90px, -10px); }
        .txt-4 { transform: rotate(315deg) translate(90px, -10px); }

        /* Указатель */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        
        /* Центральная кнопка */
        .spin-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .spin-btn:hover { transform: scale(1.05); box-shadow: 0 15px 25px rgba(16, 185, 129, 0.6); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: scale(1); }

        /* Результат */
        .result {
            margin-top: 25px;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: translateY(10px);
        }
        .result.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <h1>Крути и выигрывай!</h1>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <!-- Секторы -->
            <div class="wheel-text txt-1">Миксер</div>
            <div class="wheel-text txt-2">Пылесос</div>
            <div class="wheel-text txt-3">Колонка</div>
            <div class="wheel-text txt-4">Ключи</div>
        </div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Крутить</button>
    <div class="result" id="result"></div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;
        const prizes = ["Миксер", "Вертикальный пылесос", "Bluetooth колонка", "Набор ключей"];

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            const btn = document.getElementById('spinBtn');
            const resultEl = document.getElementById('result');
            const wheel = document.getElementById('wheel');
            
            btn.disabled = true;
            resultEl.classList.remove('show');

            // Выбираем случайный приз (0, 1, 2 или 3)
            const randomIndex = Math.floor(Math.random() * 4);
            
            // Рассчитываем угол для остановки.
            // Сектора: 
            // 0 (Миксер): 0-90
            // 1 (Пылесос): 90-180
            // 2 (Колонка): 180-270
            // 3 (Ключи): 270-360
            // Мы добавляем 5 полных оборотов (1800 градусов) + угол для нужного сектора
            const extraSpins = 1800;
            
            // Вычисляем целевой угол (чтобы указатель попал в середину сектора)
            // Для 0 сектора это 45, для 1 это 135 и т.д.
            // Но так как колесо крутится по часовой стрелке, нам нужно вычесть этот угол из 360.
            let targetAngle = 0;
            if (randomIndex === 0) targetAngle = 315; // 360 - 45
            if (randomIndex === 1) targetAngle = 225; // 360 - 135
            if (randomIndex === 2) targetAngle = 135; // 360 - 225
            if (randomIndex === 3) targetAngle = 45;  // 360 - 315

            // Добавляем случайное отклонение внутри сектора (+/- 30 градусов), чтобы не всегда падало ровно в центр
            const randomOffset = Math.floor(Math.random() * 60) - 30;
            
            currentRotation += extraSpins + targetAngle + randomOffset;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Ждем окончания анимации (4 секунды)
            setTimeout(() => {
                isSpinning = false;
                btn.disabled = false;
                resultEl.textContent = `Ваш приз: ${prizes[randomIndex]}! 🎉`;
                resultEl.classList.add('show');
            }, 4000);
        }
    </script>
</body>
</html>
