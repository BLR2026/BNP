    <title>Листопад скидок в БНП</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050914;
            --bg-card: rgba(20, 30, 55, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: #38bdf8;
            --accent-green: #10b981;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Живой фон с плавающими градиентами --- */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }
        .blob-1 { background: #4f46e5; width: 50vw; height: 50vw; top: -10%; left: -10%; }
        .blob-2 { background: #0ea5e9; width: 40vw; height: 40vw; bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { background: #10b981; width: 30vw; height: 30vw; top: 40%; left: 30%; animation-delay: -10s; opacity: 0.2; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* --- Листопад на фоне --- */
        #falling-leaves {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .leaf {
            position: absolute; top: -5vh; font-size: 1.5rem; opacity: 0;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* --- Шапка (Hero) --- */
        header {
            padding: 80px 20px 60px;
            text-align: center;
            position: relative;
        }

        .pre-title {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50px;
            color: var(--accent-glow);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .header-features {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .feature-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .feature-badge svg { width: 20px; height: 20px; fill: var(--accent-glow); }

        /* --- Таймер --- */
        .timer-container {
            margin: 40px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 20px 40px;
            border-radius: 24px;
            display: inline-flex;
            backdrop-filter: blur(10px);
        }
        .timer-label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .timer-clock {
            font-family: 'Unbounded', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-green);
            display: flex;
            gap: 10px;
        }
        .timer-unit { display: flex; flex-direction: column; align-items: center; }
        .timer-unit span:last-child { font-size: 0.7rem; color: var(--text-muted); font-family: 'Inter', sans-serif; font-weight: 400; margin-top: 5px; }

        /* --- Сетка категорий (Bento Grid) --- */
        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 20px 0;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-pill {
            white-space: nowrap;
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .category-pill:hover, .category-pill.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .category-section { margin-bottom: 60px; }
        .category-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* --- Карточка товара --- */
        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.1);
        }

        .image-wrapper {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            background: #0f172a;
            margin-bottom: 20px;
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image { transform: scale(1.08); }

        .product-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .product-specs {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .price-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .old-price {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .current-price {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        /* --- Блок оплаты --- */
        .monthly-payment {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .monthly-label {
            font-size: 0.8rem;
            color: var(--accent-green);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .monthly-value {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-green);
        }
        .monthly-value span { font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600; }

        /* --- Анимация появления --- */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            header { padding: 50px 15px 30px; }
            .product-grid { grid-template-columns: 1fr; }
            .image-wrapper { height: 200px; }
            .timer-clock { font-size: 2rem; }
        }
    </style>
</head>

    // Функция расчета платежа (скрытая от пользователя)
    function calcPayment(amount) {
        const rate = 17.7 / 100 / 12;
        const months = 60;
        return amount * rate * Math.pow(1 + rate, months) / (Math.pow(1 + rate, months) - 1);
    }

    function fmtMoney(val) {
        return val.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' BYN';
    }

    // Отрисовка каталога
    function render() {
        const catalog = document.getElementById('catalog');
        const nav = document.getElementById('categoryNav');
        let html = '';
        let navHtml = '';

        catalogData.forEach((cat, index) => {
            // Навигация
            navHtml += `<a href="#cat-${index}" class="category-pill">${cat.category}</a>`;

            html += `<section class="category-section fade-up" id="cat-${index}">
                        <h2 class="category-title">${cat.category}</h2>
                        <div class="product-grid">`;

            cat.products.forEach(p => {
                const monthly = calcPayment(p.price);
                const fallbackImg = `https://placehold.co/600x400/1e293b/94a3b8?text=${encodeURIComponent(p.name)}`;

                html += `
                    <div class="product-card">
                        <div class="image-wrapper">
                            <img src="${p.img}" alt="${p.name}" class="product-image" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImg}';">
                        </div>
                        <div class="product-info">
                            <h3 class="product-name">${p.name}</h3>
                            <p class="product-specs">${p.specs}</p>
                            
                            <div class="price-container">
                                <span class="old-price">${fmtMoney(p.oldPrice)}</span>
                                <span class="current-price">${fmtMoney(p.price)}</span>
                            </div>

                            <div class="monthly-payment">
                                <div class="monthly-label">В месяц от</div>
                                <div class="monthly-value">${monthly.toFixed(2).replace('.', ',')} <span>BYN</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></section>`;
        });

        catalog.innerHTML = html;
        nav.innerHTML = navHtml;

        // Плавный скролл по клику
        document.querySelectorAll('.category-pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = pill.getAttribute('href');
                document.querySelector(targetId).scrollIntoView({ behavior: 'smooth' });
            });
        });

        // Анимация появления
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    // Анимация листопада
    function createLeaves() {
        const container = document.getElementById('falling-leaves');
        const items = ['🍁', '🍂', '🍃', '💰', '💳'];
        const count = 20;

        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.classList.add('leaf');
            el.textContent = items[Math.floor(Math.random() * items.length)];
            
            const left = Math.random() * 100;
            const duration = 15 + Math.random() * 20;
            const delay = Math.random() * 20;
            const size = 12 + Math.random() * 20;

            el.style.left = `${left}%`;
            el.style.animationDuration = `${duration}s`;
            el.style.animationDelay = `${delay}s`;
            el.style.fontSize = `${size}px`;

            container.appendChild(el);
        }
    }

    // Таймер на 14 часов с цикличным сбросом
    function startTimer() {
        let totalSeconds = 14 * 60 * 60; // 14 часов в секундах

        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        setInterval(() => {
            if (totalSeconds <= 0) {
                totalSeconds = 14 * 60 * 60; // Сброс обратно на 14 часов
            }

            totalSeconds--;

            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            hoursEl.textContent = String(h).padStart(2, '0');
            minutesEl.textContent = String(m).padStart(2, '0');
            secondsEl.textContent = String(s).padStart(2, '0');
        }, 1000);
    }

    // Запуск
    document.addEventListener('DOMContentLoaded', () => {
        render();
        createLeaves();
        startTimer();
    });
</script>
