<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Листопад скидок в БНП</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050914;
            --bg-card: rgba(20, 30, 55, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: #38bdf8;
            --accent-green: #10b981;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }
        .blob-1 { background: #4f46e5; width: 50vw; height: 50vw; top: -10%; left: -10%; }
        .blob-2 { background: #0ea5e9; width: 40vw; height: 40vw; bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { background: #10b981; width: 30vw; height: 30vw; top: 40%; left: 30%; animation-delay: -10s; opacity: 0.2; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        #falling-leaves {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .leaf {
            position: absolute; top: -5vh; font-size: 1.5rem; opacity: 0;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            padding: 80px 20px 60px;
            text-align: center;
            position: relative;
        }

        .pre-title {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50px;
            color: var(--accent-glow);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .header-features {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .feature-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .feature-badge svg { width: 20px; height: 20px; fill: var(--accent-glow); }

        .timer-container {
            margin: 40px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 20px 40px;
            border-radius: 24px;
            display: inline-flex;
            backdrop-filter: blur(10px);
        }
        .timer-label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .timer-clock {
            font-family: 'Unbounded', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-green);
            display: flex;
            gap: 10px;
        }
        .timer-unit { display: flex; flex-direction: column; align-items: center; }
        .timer-unit span:last-child { font-size: 0.7rem; color: var(--text-muted); font-family: 'Inter', sans-serif; font-weight: 400; margin-top: 5px; }

        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 20px 0;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-pill {
            white-space: nowrap;
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .category-pill:hover, .category-pill.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .category-section { margin-bottom: 60px; }
        .category-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            perspective: 1000px;
            height: 620px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        @media (hover: hover) {
            .product-card:hover .card-inner { transform: rotateY(180deg); }
        }

        .product-card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-card);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .image-wrapper {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            background: #0f172a;
            margin-bottom: 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
            padding: 10px;
            transition: transform 0.5s ease;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-specs {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .price-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        .old-price {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .current-price {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .monthly-payment {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .monthly-label {
            font-size: 0.7rem;
            color: var(--accent-green);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .monthly-value {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-green);
        }
        .monthly-value span { font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 600; }

        .card-back h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-glow);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 10px;
        }

        .back-specs-list {
            list-style: none;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .back-specs-list::-webkit-scrollbar { width: 4px; }
        .back-specs-list::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }

        .back-specs-list li {
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .back-specs-list li::before {
            content: '•';
            color: var(--accent-glow);
            font-weight: bold;
        }

        .back-advantage {
            margin-top: auto;
            padding: 12px;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            font-size: 0.8rem;
            color: #e2e8f0;
            line-height: 1.4;
        }
        .back-advantage strong { color: var(--accent-glow); display: block; margin-bottom: 4px; }

        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            header { padding: 50px 15px 30px; }
            .product-grid { grid-template-columns: 1fr; }
            .product-card { height: 650px; }
            .timer-clock { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="ambient-bg">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
</div>
<div id="falling-leaves"></div>

<div class="container">
    <header class="fade-up">
        <div class="pre-title">Сезонная распродажа 2026</div>
        <h1>Листопад скидок в БНП</h1>
        
        <div class="header-features">
            <div class="feature-badge">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91 2.48.6 4.18 1.57 4.18 3.67 0 1.91-1.42 2.94-3.12 3.4z"/></svg>
                Оплата частями без первого взноса
            </div>
            <div class="feature-badge">
                <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                Бесплатная доставка до дома
            </div>
        </div>

        <div class="timer-container">
            <div class="timer-label">До конца акции осталось:</div>
            <div class="timer-clock" id="countdown">
                <div class="timer-unit"><span id="hours">14</span><span>часов</span></div>
                <div>:</div>
                <div class="timer-unit"><span id="minutes">00</span><span>минут</span></div>
                <div>:</div>
                <div class="timer-unit"><span id="seconds">00</span><span>секунд</span></div>
            </div>
        </div>
    </header>

    <div class="category-nav" id="categoryNav"></div>
    <main id="catalog"></main>

    <footer>
        <p>© 2026 БНП. Листопад скидок.</p>
        <p style="margin-top: 8px; font-size: 0.75rem; opacity: 0.6;">Условия оплаты частями и доставки уточняйте у менеджеров.</p>
    </footer>
</div>

<script>
    const rawCatalog = [
        {
            category: "Холодильники",
            products: [
                { 
                    name: "Beko RCNK310E20VW", 
                    basePrice: 1549.00, 
                    specs: "Общий объем 310 л • No Frost • Класс A+", 
                    img: "https://imgproxy.onliner.by/IewKap9KeWueKPqz3qXMoLTSLGqZALMdVLjCQ4kU_w0/w:400/h:400/z:2/f:jpg/aHR0cHM6Ly9jb250ZW50Lm9ubGluZXIuYnkvY2F0YWxvZy9kZXZpY2UvMjAyMS8xNDI3YjBiMjAwYmI3YTYyYTJlMzQzYWY5ZTdkZjBjNS5qcGVn",
                    fullSpecs: ["Общий объем: 310 л", "Система разморозки: No Frost", "Класс энергопотребления: A+", "Высота: 184 см", "Ширина: 60 см"],
                    advantage: "Надежная система No Frost и вместительный объем."
                },
                { 
                    name: "Kraufen RF2-55N", 
                    basePrice: 2600.00, 
                    specs: "Объем 472 л • No Frost • Side-by-Side", 
                    img: "https://imgproxy.onliner.by/UvWJUNRmP-TWzieXlx_FyEqgLR5bf6jwhAEqSOwP5xU/w:400/h:400/z:2/f:jpg/aHR0cHM6Ly9jb250ZW50Lm9ubGluZXIuYnkvY2F0YWxvZy9kZXZpY2UvMjAyNi8yMDBiODQ1ODNkMGFkODQwOGM4MWViYWNkMjBhMmIxZi5qcGc",
                    fullSpecs: ["Общий объем: 472 л", "Тип: Side-by-Side", "Система разморозки: Полный No Frost", "Класс энергопотребления: A++", "Уровень шума: 43 дБ"],
                    advantage: "Премиальный дизайн и огромный объем для большой семьи."
                },
                { 
                    name: "Indesit ITS 5200 NG", 
                    basePrice: 1189.00, 
                    specs: "Объем 320 л • No Frost • Класс A+", 
                    img: "https://imgproxy.onliner.by/YPWLJfg0c8vffF4MY4za8-si6z0Xf4r_rdvgNf2FvJo/w:400/h:400/z:2/f:jpg/aHR0cHM6Ly9jb250ZW50Lm9ubGluZXIuYnkvY2F0YWxvZy9kZXZpY2UvMjAyNS8zMTAxMTZjOTZjZWViYTQxNjdiZjQ3ODEzYThiNGU0Yy5qcGc",
                    fullSpecs: ["Общий объем: 320 л", "Система разморозки: No Frost", "Класс энергопотребления: A+", "Высота: 187 см"],
                    advantage: "Доступная цена и классический дизайн."
                }
            ]
        },
        {
            category: "Стиральные машины",
            products: [
                { 
                    name: "Beko WSPE7616A", 
                    basePrice: 1379.00, 
                    specs: "Загрузка 7 кг • Отжим 1200 об/мин • Пар", 
                    img: "https://images.weserv.nl/?url=www.beko.ru/medias/WSPE7616A-Product-Image-1.jpg",
                    fullSpecs: ["Загрузка: 7 кг", "Отжим: 1200 об/мин", "Глубина: 49 см", "Технология SteamCure", "Класс энергопотребления: A"],
                    advantage: "Инверторный мотор и обработка паром для бережной стирки."
                },
                { 
                    name: "LG Steam F1296NDS0", 
                    basePrice: 1349.00, 
                    specs: "Загрузка 6 кг • Отжим 1200 об/мин • Пар", 
                    img: "https://images.weserv.nl/?url=www.lg.com/ru/images/stiralnye-mashiny/f1296nds0/f1296nds0-1.jpg",
                    fullSpecs: ["Загрузка: 6 кг", "Отжим: 1200 об/мин", "Глубина: 44 см", "Технология Steam", "Инверторный мотор"],
                    advantage: "Узкий корпус и инновационная технология обработки паром."
                },
                { 
                    name: "Indesit ILS3 61291 S BY", 
                    basePrice: 1049.00, 
                    specs: "Загрузка 6 кг • Отжим 1200 об/мин • Узкая", 
                    img: "https://images.weserv.nl/?url=www.indesit.ru/medias/1000-Wx1000-H-ILS3-61291-S-BY-Product-Image-1.jpg",
                    fullSpecs: ["Загрузка: 6 кг", "Отжим: 1200 об/мин", "Глубина: 40 см", "Класс энергопотребления: A++"],
                    advantage: "Отличный выбор для малогабаритных квартир."
                }
            ]
        }
    ];

    function calcPayment(amount) {
        const rate = 17.7 / 100 / 12;
        const months = 60;
        return amount * rate * Math.pow(1 + rate, months) / (Math.pow(1 + rate, months) - 1);
    }

    function fmtMoney(val) {
        return val.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' BYN';
    }

    function render() {
        const catalog = document.getElementById('catalog');
        const nav = document.getElementById('categoryNav');
        let html = '';
        let navHtml = '';

        rawCatalog.forEach((cat, index) => {
            navHtml += `<a href="#cat-${index}" class="category-pill">${cat.category}</a>`;

            html += `<section class="category-section fade-up" id="cat-${index}">
                        <h2 class="category-title">${cat.category}</h2>
                        <div class="product-grid">`;

            cat.products.forEach(p => {
                const finalPrice = p.basePrice * 1.8;
                const oldPrice = finalPrice * 1.4;
                const monthly = calcPayment(finalPrice);
                const fallbackImg = `https://placehold.co/600x400/1e293b/94a3b8?text=${encodeURIComponent(p.name)}`;
                const fullSpecsHtml = p.fullSpecs.map(spec => `<li>${spec}</li>`).join('');

                html += `
                    <div class="product-card" onclick="this.classList.toggle('flipped')">
                        <div class="card-inner">
                            <div class="card-front">
                                <div class="image-wrapper">
                                    <img src="${p.img}" alt="${p.name}" class="product-image" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImg}';">
                                </div>
                                <div class="product-info">
                                    <h3 class="product-name">${p.name}</h3>
                                    <p class="product-specs">${p.specs}</p>
                                    
                                    <div class="price-container">
                                        <span class="old-price">${fmtMoney(oldPrice)}</span>
                                        <span class="current-price">${fmtMoney(finalPrice)}</span>
                                    </div>

                                    <div class="monthly-payment">
                                        <div class="monthly-label">В месяц от</div>
                                        <div class="monthly-value">${monthly.toFixed(2).replace('.', ',')} <span>BYN</span></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="card-back">
                                <h3>Подробные характеристики</h3>
                                <ul class="back-specs-list">
                                    ${fullSpecsHtml}
                                </ul>
                                <div class="back-advantage">
                                    <strong>Ключевые преимущества:</strong>
                                    ${p.advantage}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></section>`;
        });

        catalog.innerHTML = html;
        nav.innerHTML = navHtml;

        document.querySelectorAll('.category-pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = pill.getAttribute('href');
                document.querySelector(targetId).scrollIntoView({ behavior: 'smooth' });
            });
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    function createLeaves() {
        const container = document.getElementById('falling-leaves');
        const items = ['🍁', '🍂', '🍃', '💰', '💳'];
        const count = 20;

        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.classList.add('leaf');
            el.textContent = items[Math.floor(Math.random() * items.length)];
            
            const left = Math.random() * 100;
            const duration = 15 + Math.random() * 20;
            const delay = Math.random() * 20;
            const size = 12 + Math.random() * 20;

            el.style.left = `${left}%`;
            el.style.animationDuration = `${duration}s`;
            el.style.animationDelay = `${delay}s`;
            el.style.fontSize = `${size}px`;

            container.appendChild(el);
        }
    }

    function startTimer() {
        let totalSeconds = 14 * 60 * 60;

        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        setInterval(() => {
            if (totalSeconds <= 0) {
                totalSeconds = 14 * 60 * 60;
            }

            totalSeconds--;

            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            hoursEl.textContent = String(h).padStart(2, '0');
            minutesEl.textContent = String(m).padStart(2, '0');
            secondsEl.textContent = String(s).padStart(2, '0');
        }, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        render();
        createLeaves();
        startTimer();
    });
</script>
</body>
</html>
