    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-green-dark: #047857;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Manrope', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
            position: relative;
        }

        /* --- Анимированный фон --- */
        #animation-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            top: -10vh;
            opacity: 0;
            animation: fall linear infinite;
            font-weight: 800;
            font-size: 1.2rem;
            color: rgba(16, 185, 129, 0.15); /* Полупрозрачный зеленый для SALE */
            text-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .floating-item.leaf {
            font-size: 2rem;
            color: rgba(245, 158, 11, 0.2); /* Оранжевый для листьев */
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Контейнер --- */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* --- Современная шапка --- */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-radius: 32px;
            padding: 60px 40px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
            margin-bottom: 30px;
        }

        /* Свечение на фоне шапки */
        header::before {
            content: '';
            position: absolute;
            top: -50%; left: 50%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(0,0,0,0) 70%);
            transform: translateX(-50%);
            border-radius: 50%;
        }

        header h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 1;
        }

        header p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Плашка с кредитом */
        .finance-badge {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .finance-badge span { color: #34d399; }

        /* --- Категории и сетка --- */
        .category-section {
            margin-bottom: 50px;
        }

        .category-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 40px 0 20px 0;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .category-title::before {
            content: "";
            display: block;
            width: 12px;
            height: 32px;
            background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
            border-radius: 6px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* --- Карточка товара --- */
        .product-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255,255,255,1);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08);
        }

        .image-wrapper {
            width: 100%;
            height: 240px;
            border-radius: 16px;
            overflow: hidden;
            background: #f1f5f9;
            margin-bottom: 20px;
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 0 8px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .product-specs {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .price-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .old-price {
            font-size: 0.95rem;
            color: #94a3b8;
            text-decoration: line-through;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .current-price {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        /* --- Блок оплаты --- */
        .monthly-payment {
            background: #ecfdf5;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid #a7f3d0;
            margin-top: auto;
            position: relative;
            overflow: hidden;
        }

        .monthly-payment::before {
            content: 'Выгодно';
            position: absolute;
            top: 0; right: 0;
            background: #10b981;
            color: white;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 10px;
            border-bottom-left-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .monthly-label {
            font-size: 0.85rem;
            color: var(--accent-green-dark);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .monthly-value {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-green);
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
        }

        .monthly-value span {
            font-family: 'Manrope', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-green-dark);
        }

        /* --- Подвал --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 40px;
            border-top: 1px solid #e2e8f0;
        }

        /* --- Мобильная адаптация --- */
        @media (max-width: 768px) {
            header { padding: 40px 20px; border-radius: 24px; }
            header h1 { font-size: 2.2rem; }
            header p { font-size: 1rem; }
            .product-grid { grid-template-columns: 1fr; gap: 20px; }
            .image-wrapper { height: 200px; }
            .current-price { font-size: 1.4rem; }
            .monthly-value { font-size: 1.3rem; }
        }

    // Расчет аннуитетного платежа (17.7% на 60 мес)
    function calcPayment(amount) {
        const rate = 17.7 / 100 / 12;
        const months = 60;
        return amount * rate * Math.pow(1 + rate, months) / (Math.pow(1 + rate, months) - 1);
    }

    // Форматирование валюты
    function fmtMoney(val) {
        return val.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' BYN';
    }

    // Отрисовка каталога
    function render() {
        const catalog = document.getElementById('catalog');
        let html = '';

        catalogData.forEach(cat => {
            html += `<section class="category-section">
                        <h2 class="category-title">${cat.category}</h2>
                        <div class="product-grid">`;

            cat.products.forEach(p => {
                const monthly = calcPayment(p.price);
                const fallbackImg = `https://placehold.co/600x400/f1f5f9/64748b?text=${encodeURIComponent(p.name)}`;

                html += `
                    <div class="product-card">
                        <div class="image-wrapper">
                            <img src="${p.img}" alt="${p.name}" class="product-image" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImg}';">
                        </div>
                        <div class="product-info">
                            <h3 class="product-name">${p.name}</h3>
                            <p class="product-specs">${p.specs}</p>
                            
                            <div class="price-container">
                                <span class="old-price">${fmtMoney(p.oldPrice)}</span>
                                <span class="current-price">${fmtMoney(p.price)}</span>
                            </div>

                            <div class="monthly-payment">
                                <div class="monthly-label">В месяц от</div>
                                <div class="monthly-value">${monthly.toFixed(2).replace('.', ',')} <span>BYN</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></section>`;
        });

        catalog.innerHTML = html;
    }

    // Генерация анимированного фона (Листопад и Скидки)
    function createAnimation() {
        const container = document.getElementById('animation-bg');
        const items = ['🍁', '🍂', '🍃', 'SALE', '-40%', 'ХИТ'];
        const count = 30;

        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            const isLeaf = Math.random() > 0.5;
            
            el.classList.add('floating-item');
            if (isLeaf) {
                el.classList.add('leaf');
                el.textContent = items[Math.floor(Math.random() * 3)];
            } else {
                el.textContent = items[Math.floor(Math.random() * 3) + 3];
            }
            
            // Случайные параметры падения
            const left = Math.random() * 100;
            const duration = 10 + Math.random() * 20; // 10-30 секунд
            const delay = Math.random() * 15;
            const size = isLeaf ? (16 + Math.random() * 20) : (12 + Math.random() * 10);

            el.style.left = `${left}%`;
            el.style.animationDuration = `${duration}s`;
            el.style.animationDelay = `${delay}s`;
            el.style.fontSize = `${size}px`;

            container.appendChild(el);
        }
    }

    // Запуск
    document.addEventListener('DOMContentLoaded', () => {
        render();
        createAnimation();
    });
