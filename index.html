<head>
    <meta charset="UTF-8">

    <title>Автобнп — Техника и Электроника</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --accent: #10b981;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Анимированный фон (листопад акций) */
        #falling-leaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            top: -50px;
            font-size: 24px;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 24px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.25);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .finance-banner {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            font-weight: 600;
            color: #1e40af;
        }

        .finance-banner .badge {
            background: #dbeafe;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.95rem;
        }

        .category-section {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 28px;
            background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
            border-radius: 4px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            background: #ffffff;
        }

        .product-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
        }

        .product-info {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .product-specs {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .price-block {
            margin-bottom: 15px;
        }

        .old-price {
            font-size: 1rem;
            color: #94a3b8;
            text-decoration: line-through;
            margin-bottom: 4px;
            display: block;
            font-weight: 500;
        }

        .current-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .monthly-payment {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 1px solid #a7f3d0;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-top: auto;
        }

        .monthly-label {
            font-size: 0.85rem;
            color: #047857;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .monthly-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #059669;
        }

        .monthly-value span {
            font-size: 1rem;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 40px;
            background: rgba(255,255,255,0.5);
            border-radius: 24px;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .product-grid { grid-template-columns: 1fr; }
            .finance-banner { flex-direction: column; gap: 10px; text-align: center; }
            .product-image { height: 200px; }
            .current-price { font-size: 1.5rem; }
            .monthly-value { font-size: 1.4rem; }
        }
    </style>
</head>

    // Функция расчета аннуитетного платежа (17.7% на 60 мес)
    function calculateMonthlyPayment(amount) {
        const rate = 17.7 / 100 / 12; // месячная ставка
        const months = 60;
        const payment = amount * rate * Math.pow(1 + rate, months) / (Math.pow(1 + rate, months) - 1);
        return payment;
    }

    // Форматирование валюты
    function formatMoney(value) {
        return value.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' BYN';
    }

    // Рендер каталога
    function renderCatalog() {
        const catalogContainer = document.getElementById('catalog');
        let html = '';

        catalogData.forEach(category => {
            html += `<section class="category-section">
                        <h2 class="category-title">${category.category}</h2>
                        <div class="product-grid">`;

            category.products.forEach(product => {
                const monthlyPayment = calculateMonthlyPayment(product.price);
                // Заглушка на случай, если картинка не загрузится
                const fallbackImg = `https://placehold.co/600x400/f1f5f9/64748b?text=${encodeURIComponent(product.name)}`;

                html += `
                    <div class="product-card">
                        <img src="${product.img}" alt="${product.name}" class="product-image" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImg}';">
                        <div class="product-info">
                            <h3 class="product-name">${product.name}</h3>
                            <p class="product-specs">${product.specs}</p>
                            
                            <div class="price-block">
                                <span class="old-price">${formatMoney(product.oldPrice)}</span>
                                <span class="current-price">${formatMoney(product.price)}</span>
                            </div>

                            <div class="monthly-payment">
                                <div class="monthly-label">Всего от</div>
                                <div class="monthly-value">${monthlyPayment.toFixed(2).replace('.', ',')} <span>BYN/мес</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></section>`;
        });

        catalogContainer.innerHTML = html;
    }

    // Анимация фона (Листопад)
    function createFallingLeaves() {
        const container = document.getElementById('falling-leaves');
        const symbols = ['🍂', '🍁', '💸', '💵', '💳']; // Символы акций и осени
        const leafCount = 25;

        for (let i = 0; i < leafCount; i++) {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf');
            leaf.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            
            // Случайные позиции и тайминги
            const left = Math.random() * 100;
            const animationDuration = 10 + Math.random() * 15; // от 10 до 25 секунд
            const delay = Math.random() * 15;
            const size = 16 + Math.random() * 16; // от 16px до 32px

            leaf.style.left = `${left}%`;
            leaf.style.animationDuration = `${animationDuration}s`;
            leaf.style.animationDelay = `${delay}s`;
            leaf.style.fontSize = `${size}px`;

            container.appendChild(leaf);
        }
    }

    // Запуск после загрузки страницы
    document.addEventListener('DOMContentLoaded', () => {
        renderCatalog();
        createFallingLeaves();
    });
